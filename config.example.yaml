trading:
  mode: paper
  require_manual_approval: true
  confidence_threshold: 75
  symbols:
    - exchange: NSE
      symbol: SBIN-EQ
      token: "3045"
      quantity: 1
      timeframe: FIVE_MINUTE
      instrument_type: equity
    - exchange: NSE
      symbol: NIFTY 50
      token: "99926000"
      quantity: 1
      timeframe: FIVE_MINUTE
      instrument_type: index
    - exchange: NSE
      symbol: NIFTY BANK
      token: "99926009"
      quantity: 1
      timeframe: FIVE_MINUTE
      instrument_type: index

scanner:
  enabled: false
  max_candidates: 20
  min_average_volume: 100000

derivatives:
  enabled: false
  instruments:
    - futures
    - options
  option_buying_only: true
  prefer_long_options: true
  min_average_volume: 100
  confidence_threshold: 55
  option_strikes: 1
  minimum_expiry_days: 1
  max_expiry_days: 45
  max_contracts: 6
  timeframe: FIVE_MINUTE
  timeout_seconds: 10

backtesting:
  enabled: false
  minimum_candles: 80
  holding_bars: 12
  round_trip_cost_bps: 10

paper_execution:
  enabled: false
  initial_balance: 300000
  max_open_positions: 2
  slippage_bps: 5
  fee_bps: 10
  max_holding_minutes: 120
  market_hours_only: true
  max_candle_age_minutes: 10
  state_file: logs/paper_portfolio.json

risk:
  capital: 300000
  risk_per_trade_pct: 0.5
  max_daily_loss_pct: 2.0
  max_trades_per_day: 5
  stop_after_consecutive_losses: 3
  max_position_value_pct: 10
  avoid_high_impact_news: true

strategy:
  ema_fast: 9
  ema_slow: 21
  ema_trend: 50
  rsi_period: 14
  atr_period: 14
  min_reward_risk: 1.5

news:
  enabled: true
  rss_feeds:
    - https://www.rbi.org.in/Scripts/BS_PressReleaseDisplay.aspx
  manual_headlines: []

market_data:
  provider: demo
  lookback_days: 5
  request_interval_seconds: 1.2
  max_retries: 2
  retry_backoff_seconds: 3

market_dashboard:
  enabled: false
  refresh_seconds: 15
  timeframe: ONE_MINUTE
  candle_limit: 120
  lookback_days: 2

bulk_deals:
  enabled: false
  provider: nse
  max_age_days: 7
  max_confidence_points: 10
  min_imbalance_ratio: 0.2
  timeout_seconds: 8

logging:
  decision_log: logs/decisions.jsonl
