name: Safety Tests

on:
  push:
  pull_request:

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r trading_agent/requirements-dev.txt
      - name: Run safety tests
        working-directory: trading_agent
        run: python -m pytest -v
